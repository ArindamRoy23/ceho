[project]
name = "ceho"
version = "0.1.0"
description = "Persistent, speaker-aware conversational runtime"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.0.55",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
exclude = ["^\\.venv/", "^docs/", "^\\.devcontainer/", "^\\.github/"]
