# Local development only. PostgreSQL is a provisional database. MinIO is the
# local S3 API for media objects; cloud deployment uses the same bucket URI
# with CEHO_S3_ENDPOINT_URL unset. Vector store, cache, and queue are absent.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/ceho:cached
    command: sleep infinity
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ceho:ceho@postgres:5432/ceho}
      UV_PROJECT_ENVIRONMENT: /home/vscode/.venv

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ceho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceho}
      POSTGRES_DB: ${POSTGRES_DB:-ceho}
    ports:
      # Host port 5433 avoids colliding with another local Postgres on 5432.
      # Inside the Compose network the port is still 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceho -d ceho"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Community minio/minio images are no longer published. This Chainguard
  # image is the MinIO server binary. It has no shell, so the bucket is
  # created by minio-init. Root owns the named volume; this service is local only.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ceho}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ceho-dev-only}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # The dev client image has a shell so this can wait until MinIO accepts
  # connections, then create the bucket once.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_started
    environment:
      MC_HOST_ceho: http://${MINIO_ROOT_USER:-ceho}:${MINIO_ROOT_PASSWORD:-ceho-dev-only}@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until mc mb --ignore-existing ceho/${MINIO_BUCKET:-ceho-media}; do
          i=$$((i + 1))
          if [ "$$i" -gt 30 ]; then
            exit 1
          fi
          sleep 1
        done
    restart: "no"

volumes:
  postgres-data:
  minio-data:
